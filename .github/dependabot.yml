# Keeps dependencies current. Once a week, Dependabot opens PRs into staging (the default branch); CI tests them and I squash-merge.
# Minor and patch updates are grouped into one PR per ecosystem. Major updates get their own PR each,
# so one breaking upgrade can't hold up the rest.
version: 2
updates:
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    # Skips versions released in the last 7 days: a hijacked package is usually caught and pulled within days
    cooldown:
      default-days: 7
    groups:
      npm:
        update-types: [minor, patch]

  # Finds the projects through api/Jot.slnx; also updates dotnet-ef in dotnet-tools.json
  - package-ecosystem: nuget
    directory: /api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      nuget:
        update-types: [minor, patch]

  # The actions used in .github/workflows (checkout, setup-dotnet, setup-node)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
